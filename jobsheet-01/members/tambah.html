<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Member - SIMPUS-Mini</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. Perbaiki jalur CSS ke dalam folder assets/css/ -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <h1>SIMPUS-Mini</h1>
        <!-- 2. Ubah checkbox hack menjadi button untuk JavaScript Hamburger -->
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        
        <nav>
            <ul>
                <li><a href="/jobsheet-01/index.html">Home</a></li>
                <li><a href="/jobsheet-01/books/list.html">List of Books</a></li>
                <li><a href="/jobsheet-01/books/tambah.html">Add Book</a></li>
                <li><a href="/jobsheet-01/members/list.html">List of Members</a></li>
                <li><a href="/jobsheet-01/members/tambah.html">Add Member</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Add New Member</h2>

            <!-- 3. Tambahkan id="form-tambah" agar skrip validasi JS mendeteksinya -->
            <form id="form-tambah" action="#" method="POST">
                <p>
                    <label for="name">Name</label><br>
                    <input type="text" id="name" name="name">
                </p>

                <p>
                    <label for="no_anggota">Member No</label><br>
                    <input type="text" id="no_anggota" name="no_anggota">
                </p>

                <p>
                    <label for="address">Address</label><br>
                    <input type="text" id="address" name="address">
                </p>

                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>

                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email">
                </p>

                <p>
                    <button type="submit">Save</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini — Jobsheet 5</p>
    </footer>

    <!-- 4. Hubungkan file JavaScript app.js -->
    <script src="../assets/js/app.js"></script>
</body>
</html>
