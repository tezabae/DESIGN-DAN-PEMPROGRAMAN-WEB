<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Member - SIMPUS-Mini</title>
    <!-- Penghubung ke file CSS di luar subfolder -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <header>
        <h1>SIMPUS-Mini</h1>
        <nav>
            <ul>
                <li><a href="/jobsheet-01/index.html">Home</a></li>
                <li><a href="/jobsheet-01/books/list.html">List of Books</a></li>

                <li><a href="/jobsheet-01/members/list.html">List of Members</a></li>
                <li><a href="/jobsheet-01/members/tambah.html">Add Member</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Add New Member</h2>

            <form>
                <p>
                    <label for="name">Name</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="no_anggota">Member No</label><br>
                    <input type="text" id="no_anggota" name="no_anggota" required>
                </p>

                <p>
                    <label for="address">Address</label><br>
                    <input type="text" id="address" name="address">
                </p>

                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>

                <p>
                    <label for="email">Email</label><br>
                    <input type="email" id="email" name="email">
                </p>

                <p>
                    <button type="submit">Save</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini — Jobsheet 2</p>
    </footer>

</body>
</html>
