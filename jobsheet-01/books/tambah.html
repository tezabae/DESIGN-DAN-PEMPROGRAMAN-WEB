<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book - SIMPUS-Mini</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. Perbaiki jalur CSS ke dalam folder assets/css/ -->
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <header>
        <h1>SIMPUS-Mini</h1>
        <!-- 2. Ubah checkbox hack menjadi button untuk JavaScript Hamburger -->
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        
        <nav>
            <ul>
                <li><a href="/jobsheet-01/index.html">Home</a></li>
                <li><a href="/jobsheet-01/books/list.html">List of Books</a></li>
                <li><a href="/jobsheet-01/books/tambah.html">Add Book</a></li>
                <li><a href="/jobsheet-01/members/list.html">List of Members</a></li>
                <li><a href="/jobsheet-01/members/tambah.html">Add Member</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Add New Book</h2>

            <!-- 3. Tambahkan id="form-tambah" agar skrip validasi JS mendeteksinya -->
            <form id="form-tambah" action="#" method="POST"> 
                <p> 
                    <label for="title">Title</label><br> 
                    <input type="text" id="title" name="title">
                </p>

                <p> 
                    <label for="author">Author</label><br> 
                    <input type="text" id="author" name="author"> 
                </p>

                <p> 
                    <label for="year">Year</label><br> 
                    <input type="number" id="year" name="year" min="1900" max="2026"> 
                </p>

                <p> 
                    <label for="isbn">ISBN</label><br> 
                    <input type="text" id="isbn" name="isbn"> 
                </p>

                <p> 
                    <label for="stock">Stock</label><br> 
                    <input type="number" id="stock" name="stock" min="0"> 
                </p>

                <p> 
                    <label for="category">Category</label><br>
                    <select id="category" name="category"> 
                        <option value="fiction">Fiction</option> 
                        <option value="non-fiction">Non-Fiction</option> 
                        <option value="reference">Reference</option> 
                    </select> 
                </p>

                <p> 
                    <button type="submit">Save</button> 
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini — Jobsheet 5</p>
    </footer>

    <!-- 4. Hubungkan file JavaScript app.js -->
    <script src="../assets/js/app.js"></script>
</body>
</html>
