<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Books - SIMPUS-Mini</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <!-- Di bagian bawah body -->
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>

    <header>
        <h1>SIMPUS-Mini</h1>
        
        <!-- Tombol untuk JavaScript Hamburger -->
        <button type="button" id="nav-toggle-btn" class="nav-toggle-label" aria-label="Menu">&#9776;</button>
        
        <nav>
            <ul>
                <li><a href="/jobsheet-01/index.html">Home</a></li>
                <li><a href="/jobsheet-01/books/list.html">List of Books</a></li>
                <li><a href="/jobsheet-01/books/tambah.html">Add Book</a></li>
                <li><a href="/jobsheet-01/members/list.html">List of Members</a></li>
                <li><a href="/jobsheet-01/members/tambah.html">Add Member</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>List of Books</h2>
            
            <!-- Search Box untuk fitur Real-time Filter -->
            <div class="search-box" style="margin-bottom: 1rem;">
                <input type="text" id="search-input" placeholder="Cari judul buku..." style="padding: 0.5rem; width: 100%; max-width: 300px;">
            </div>

            <!-- BARU (Jobsheet 6): Indikator Loading -->
            <p id="loading-indicator" style="display:none;">Loading data...</p>

            <div class="table-responsive">
                <table> 
                    <thead> 
                        <tr> 
                            <th>Title</th> 
                            <th>Author</th> 
                            <th>Year</th> 
                            <th>Stock</th>
                            <th>Aksi</th> 
                        </tr> 
                    </thead> 
                    <tbody> 
                        <!-- KOSONG (Jobsheet 6): Baris akan diisi otomatis oleh assets/js/buku.js via fetch() -->
                    </tbody> 
                </table> 
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini — Jobsheet 6</p>
    </footer>

    <!-- Hubungkan file JavaScript (app.js dan buku.js) -->
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/buku.js"></script>
</body>
</html>
